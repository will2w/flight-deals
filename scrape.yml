name: scrape-flight-deals

on:
  schedule:
    # UTC 01/07/13/19 = 台北時間 09/15/21/03
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-flight-deals
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝依賴
        run: pip install -r requirements.txt

      - name: 抓取票價並更新 data/
        run: python -m src.pipeline

      - name: 提交資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "沒有變更，略過提交"
          else
            git commit -m "chore: update flight deals $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
